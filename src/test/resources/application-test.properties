whatsapp.graph-base-url=https://graph.example.test
# Tests opt into loopback SMS explicitly; inherited live environment settings cannot enable a gateway.
sms.enabled=false
sms.http-inbound.enabled=false
sms.mode=MOCK
sms.live-authorized=false
sms.bind-address=127.0.0.1
sms.port=0
whatsapp.graph-api-version=v99.0
whatsapp.phone-number-id=123456789
whatsapp.access-token=test-access-token
whatsapp.app-secret=test-app-secret
whatsapp.verify-token=test-verify-token
whatsapp.outbound-max-attempts=2
whatsapp.outbound-max-retry-delay=0s
whatsapp.webhook-max-request-bytes=262144

ai.provider=mock
ai.timeout=1s
ai.max-retries=0
ai.max-response-characters=4096

dispatch.worker-count=2
dispatch.queue-capacity=10
dispatch.deduplication-capacity=100
dispatch.deduplication-ttl=1h
dispatch.shutdown-timeout=1s

outbound.local-auth-token=test-local-auth-token
outbound.allowed-recipients=15551234567,639123456789
outbound.allowed-templates=hello_world,order_update
outbound.idempotency-capacity=100
outbound.idempotency-ttl=1h
spring.datasource.url=jdbc:h2:mem:channelconnecttest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
messenger.app-secret=test-app-secret
messenger.verify-token=test-verify-token
messenger.page-access-token=test-page-token
messenger.page-id=test-page
messenger.graph-api-version=v1.0
messenger.queue-capacity=3
openai.api-key=test-openai-key
openai.model=test-model
openai.vector-store-id=test-vector-store
openai.history-limit=10
admin.username=test-admin
admin.password=test-password
retention.content-days=30
retention.diagnostic-days=7
retention.psid-inactivity-days=90
retention.log-days=14
retention.cleanup-cron=0 0 2 * * *
retention.ai-diagnostics-enabled=false

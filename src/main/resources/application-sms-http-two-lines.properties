# Use this profile instead of sms-http when both GoIP8 web form lines are enabled.
sms.enabled=true
sms.mode=HTTP
sms.live-authorized=true
sms.session-timeout=${SMS_GOIP_TIMEOUT:60s}
sms.api-token=${SMS_API_TOKEN:}
sms.channels[0].account-id=goip-line-1
sms.channels[0].device-id=${SMS_GOIP_GATEWAY_ID:goip8}
sms.channels[0].sim-channel=1
sms.channels[0].source-address=${SMS_GOIP_IPADDRESS:}
sms.channels[0].auth-id=${SMS_GOIP_USER:}
sms.channels[0].password=${SMS_GOIP_PASS:}
sms.channels[1].account-id=goip-line-2
sms.channels[1].device-id=${SMS_GOIP_GATEWAY_ID:goip8}
sms.channels[1].sim-channel=2
sms.channels[1].source-address=${SMS_GOIP_IPADDRESS:}
sms.channels[1].auth-id=${SMS_GOIP_USER:}
sms.channels[1].password=${SMS_GOIP_PASS:}

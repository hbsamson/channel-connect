# Add after the sender profile: local,sms-http,sms-own-receive (or sms-http-api).
# GoIP must target this application's private UDP address with the credentials below.
sms.http-inbound.enabled=true
sms.http-api.receive-enabled=false
sms.http-api.receive-url=
sms.http-api.receive-key=
sms.http-inbound.channels[0].account-id=goip-line-1
sms.http-inbound.channels[0].auth-id=${SMS_GOIP_UDP_ID:}
sms.http-inbound.channels[0].password=${SMS_GOIP_UDP_PASSWORD:}

#---
# The two-line web sender receives both configured SIMs through the same listener.
spring.config.activate.on-profile=sms-http-two-lines
sms.http-inbound.channels[0].account-id=goip-line-1
sms.http-inbound.channels[0].auth-id=${SMS_GOIP_UDP_ID:}
sms.http-inbound.channels[0].password=${SMS_GOIP_UDP_PASSWORD:}
sms.http-inbound.channels[1].account-id=goip-line-2
sms.http-inbound.channels[1].auth-id=${SMS_GOIP_UDP_ID_2:}
sms.http-inbound.channels[1].password=${SMS_GOIP_UDP_PASSWORD_2:}

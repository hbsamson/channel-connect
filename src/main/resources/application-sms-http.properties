# GoIP8 web form sender; supply all gateway details and the recipient allowlist externally.
sms.enabled=true
sms.mode=HTTP
sms.live-authorized=true
sms.session-timeout=${SMS_GOIP_TIMEOUT:60s}
sms.api-token=${SMS_API_TOKEN:}
sms.allowed-recipients=${SMS_ALLOWED_RECIPIENTS:}
sms.channels[0].account-id=goip-line-1
sms.channels[0].device-id=goip8
sms.channels[0].sim-channel=1
sms.channels[0].source-address=${SMS_GOIP_IPADDRESS:}
sms.channels[0].auth-id=${SMS_GOIP_USER:}
sms.channels[0].password=${SMS_GOIP_PASS:}

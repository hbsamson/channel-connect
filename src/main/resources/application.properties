spring.application.name=channel-connect

# No UDP socket or provider is created until SMS is explicitly enabled.
sms.enabled=${SMS_ENABLED:false}
sms.mode=${SMS_PROVIDER_MODE:MOCK}
sms.bind-address=${SMS_UDP_BIND_ADDRESS:127.0.0.1}
sms.port=${SMS_UDP_PORT:0}
sms.live-authorized=${SMS_LIVE_AUTHORIZED:false}
sms.api-token=${SMS_API_TOKEN:}
sms.registration-timeout=${SMS_REGISTRATION_TIMEOUT:90s}
sms.session-timeout=${SMS_SESSION_TIMEOUT:80s}
sms.packet-timeout=${SMS_PACKET_TIMEOUT:3s}
sms.poll-interval=${SMS_POLL_INTERVAL:3s}
sms.max-polls=${SMS_MAX_POLLS:10}
sms.max-sessions=${SMS_MAX_SESSIONS:5}
sms.queue-capacity=${SMS_QUEUE_CAPACITY:1000}
sms.max-content-bytes=${SMS_MAX_CONTENT_BYTES:3000}
sms.max-segments=${SMS_MAX_SEGMENTS:1}
sms.processing-attempts=${SMS_PROCESSING_ATTEMPTS:3}
sms.processing-retry-delay=${SMS_PROCESSING_RETRY_DELAY:1s}
sms.queue-expiry=${SMS_QUEUE_EXPIRY:24h}
sms.content-retention=${SMS_CONTENT_RETENTION:30d}
sms.id-retention=${SMS_ID_RETENTION:90d}
sms.shutdown-timeout=${SMS_SHUTDOWN_TIMEOUT:10s}
sms.http-inbound.enabled=${SMS_GOIP_RECEIVE_ENABLED:false}
# Hosted inbox reception can be combined with direct HTTP web-form sending.
sms.http-api.receive-enabled=${SMS_GOIP_API_RECEIVE_ENABLED:false}
sms.http-api.receive-url=${SMS_GOIP_API_RECEIVE_URL:}
sms.http-api.receive-key=${SMS_GOIP_API_RECEIVE_KEY:}
sms.http-api.max-response-bytes=${SMS_GOIP_API_MAX_RESPONSE_BYTES:1048576}
spring.datasource.url=jdbc:h2:file:./data/channel-connect;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.connection-init-sql=SET WRITE_DELAY 0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

messenger.app-secret=${META_APP_SECRET}
messenger.verify-token=${META_VERIFY_TOKEN}
messenger.page-access-token=${META_PAGE_ACCESS_TOKEN}
messenger.page-id=${META_PAGE_ID}
messenger.graph-api-version=${META_GRAPH_API_VERSION}
messenger.queue-capacity=${MESSENGER_QUEUE_CAPACITY:100}

openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-5-nano}
openai.vector-store-id=${OPENAI_VECTOR_STORE_ID:}
openai.history-limit=${OPENAI_HISTORY_LIMIT:20}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:1024}
openai.assistant-instructions=${OPENAI_ASSISTANT_INSTRUCTIONS:You are a helpful Messenger assistant. Use conversation history to remember user preferences. Reply naturally and concisely, usually in 1-3 sentences. Avoid long lists, introductions, generic filler, and unnecessary follow-up questions. Give detailed answers when explicitly requested. Finish complete sentences and questions within the response budget; omit optional detail instead of ending mid-sentence.}
openai.reasoning-effort=${OPENAI_REASONING_EFFORT:minimal}
# RestClient DEBUG output can include complete request bodies.
logging.level.org.springframework.web.client=INFO

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

retention.content-days=${CONTENT_RETENTION_DAYS:30}
retention.diagnostic-days=${AI_DIAGNOSTIC_RETENTION_DAYS:7}
retention.psid-inactivity-days=${PSID_INACTIVITY_DAYS:90}
retention.log-days=${ERROR_LOG_RETENTION_DAYS:14}
retention.cleanup-cron=${RETENTION_CLEANUP_CRON:0 0 2 * * *}
retention.ai-diagnostics-enabled=${AI_DIAGNOSTICS_ENABLED:false}
server.port=8080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.http.clients.connect-timeout=${HTTP_CONNECT_TIMEOUT:3s}
spring.http.clients.read-timeout=${HTTP_READ_TIMEOUT:10s}

whatsapp.graph-base-url=${META_GRAPH_BASE_URL:https://graph.facebook.com}
whatsapp.graph-api-version=${META_GRAPH_API_VERSION}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.app-secret=${META_APP_SECRET}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN}
whatsapp.outbound-max-attempts=${WHATSAPP_OUTBOUND_MAX_ATTEMPTS:2}
whatsapp.outbound-max-retry-delay=${WHATSAPP_OUTBOUND_MAX_RETRY_DELAY:2s}
whatsapp.webhook-max-request-bytes=${WHATSAPP_WEBHOOK_MAX_REQUEST_BYTES:262144}

ai.provider=${AI_PROVIDER:mock}
ai.api-key=${OPENAI_API_KEY:}
ai.model=${OPENAI_MODEL:}
ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
ai.timeout=${OPENAI_TIMEOUT:30s}
ai.max-retries=${OPENAI_MAX_RETRIES:2}
ai.max-response-characters=${AI_MAX_RESPONSE_CHARACTERS:4096}
ai.reasoning-effort=${OPENAI_REASONING_EFFORT:minimal}
ai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:2048}


dispatch.worker-count=${DISPATCH_WORKER_COUNT:4}
dispatch.queue-capacity=${DISPATCH_QUEUE_CAPACITY:100}
dispatch.deduplication-capacity=${DISPATCH_DEDUPLICATION_CAPACITY:10000}
dispatch.deduplication-ttl=${DISPATCH_DEDUPLICATION_TTL:24h}
dispatch.shutdown-timeout=${DISPATCH_SHUTDOWN_TIMEOUT:10s}

outbound.local-auth-token=${OUTBOUND_LOCAL_AUTH_TOKEN}
outbound.allowed-recipients=${OUTBOUND_ALLOWED_RECIPIENTS}
outbound.allowed-templates=${OUTBOUND_ALLOWED_TEMPLATES:hello_world}
outbound.idempotency-capacity=${OUTBOUND_IDEMPOTENCY_CAPACITY:1000}
outbound.idempotency-ttl=${OUTBOUND_IDEMPOTENCY_TTL:24h}

dealership.name=${DEALERSHIP_NAME:Toyota Manila Bay}
dealership.catalog=${DEALERSHIP_CATALOG:classpath:dealership/catalog.json}
dealership.campaign=${DEALERSHIP_CAMPAIGN:classpath:campaigns/registration-renewal.json}
dealership.customers=${DEALERSHIP_CUSTOMERS:classpath:dealership/customers.json}
dealership.prompt=${DEALERSHIP_PROMPT:classpath:prompts/dealership-assistant.md}
dealership.scheduler-enabled=${DEALERSHIP_SCHEDULER_ENABLED:false}
dealership.history-limit=${DEALERSHIP_HISTORY_LIMIT:20}
dealership.max-provider-failures=${DEALERSHIP_MAX_PROVIDER_FAILURES:3}
# HTTP/JDBC tracing can expose customer content and identity values.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

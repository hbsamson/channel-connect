# Hosted PHP gateway contract from the operator's GoIP8 Postman collection.
sms.enabled=true
sms.mode=HTTP_API
sms.live-authorized=true
sms.session-timeout=${SMS_GOIP_TIMEOUT:60s}
sms.api-token=${SMS_API_TOKEN:}
sms.http-api.send-url=${SMS_GOIP_API_SEND_URL:}
sms.http-api.receive-url=${SMS_GOIP_API_RECEIVE_URL:}
sms.http-api.receive-key=${SMS_GOIP_API_RECEIVE_KEY:}
sms.http-api.max-response-bytes=${SMS_GOIP_API_MAX_RESPONSE_BYTES:1048576}
sms.channels[0].account-id=goip-line-1
sms.channels[0].device-id=${SMS_GOIP_GATEWAY_ID:goip8}
sms.channels[0].sim-channel=1
# A private source address is required when adding sms-own-receive.
sms.channels[0].source-address=${SMS_GOIP_IPADDRESS:127.0.0.1}
sms.channels[0].auth-id=http-api
sms.channels[0].password=http-api-unused
sms.channels[1].account-id=goip-line-2
sms.channels[1].device-id=${SMS_GOIP_GATEWAY_ID:goip8}
sms.channels[1].sim-channel=2
sms.channels[1].source-address=${SMS_GOIP_IPADDRESS:127.0.0.1}
sms.channels[1].auth-id=http-api
sms.channels[1].password=http-api-unused

# Local IntelliJ and Maven runs load the repository-root environment file.
# Use plain KEY=value entries (Java properties syntax), without shell quotes.
# Operating-system environment variables and command-line arguments take precedence.
spring.config.import=optional:file:./.env[.properties]
# The supplied SMS campaign templates allow up to two GSM-7 messages.
sms.max-segments=${SMS_MAX_SEGMENTS:2}
